name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python-test:
    name: Test (${{ matrix.os }} - Py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    defaults:
      run:
        working-directory: production-filesystem

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "production-filesystem/pyproject.toml"

      - name: Configure Git for tests
        run: |
          git config --global user.name "CI Runner"
          git config --global user.email "ci@example.com"

      - name: Install dependencies and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run test suite
        run: |
          pytest -v

  python-quality:
    name: Python static checks and coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: production-filesystem
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: production-filesystem/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Compile and lint
        run: |
          python -m compileall -q src tests examples
          ruff check src tests examples
      - name: Coverage
        run: pytest --cov=mcp_fs --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: production-filesystem/coverage.xml

  python-artifacts:
    name: Build and install Python artifacts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: production-filesystem
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: Install wheel and exercise stdio
        shell: bash
        run: |
          python -m venv /tmp/mcp-wheel
          /tmp/mcp-wheel/bin/pip install dist/*.whl
          response=$(printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"artifact-smoke","version":"1.0"}}}' | /tmp/mcp-wheel/bin/mcp-filesystem-server)
          grep -q 'File System Server' <<<"$response"
      - name: Install source distribution
        run: |
          python -m venv /tmp/mcp-sdist
          /tmp/mcp-sdist/bin/pip install dist/*.tar.gz
          /tmp/mcp-sdist/bin/python -c "import mcp_fs; print(mcp_fs.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: production-filesystem/dist/*

  python-container:
    name: Python container smoke test
    runs-on: ubuntu-latest
    needs: python-test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mcp-filesystem-python:ci production-filesystem
      - name: Verify non-root authenticated MCP service
        shell: bash
        run: |
          test "$(docker run --rm --entrypoint id mcp-filesystem-python:ci -u)" = "1000"
          token="ci-only-auth-token-at-least-16-bytes"
          container_id=$(docker run --rm -d -p 127.0.0.1:18081:8000 -e MCP_FS_AUTH_TOKEN="$token" mcp-filesystem-python:ci)
          trap 'docker stop "$container_id" >/dev/null 2>&1 || true' EXIT
          for attempt in {1..50}; do
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18081/mcp || true)
            if test "$code" != "000"; then break; fi
            sleep 0.1
          done
          response=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"container-smoke","version":"1.0"}}}' \
            http://127.0.0.1:18081/mcp)
          grep -q 'File System Server' <<<"$response"

  rust-test:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
      run:
        working-directory: rust-filesystem

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-filesystem -> target

      - name: Configure Git for tests
        run: |
          git config --global user.name "CI Runner"
          git config --global user.email "ci@example.com"

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run strict lints
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run Rust test suite
        run: cargo test --locked --all-targets

      - name: Build release binary
        run: cargo build --locked --release

  rust-container:
    name: Rust container smoke test
    runs-on: ubuntu-latest
    needs: rust-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build container
        run: docker build -t mcp-filesystem-rust:ci rust-filesystem

      - name: Verify image user and command
        run: |
          test "$(docker run --rm --entrypoint id mcp-filesystem-rust:ci -u)" = "1000"
          docker run --rm mcp-filesystem-rust:ci --version

      - name: Perform authenticated MCP handshake
        shell: bash
        run: |
          token="ci-only-auth-token-at-least-16-bytes"
          container_id=$(docker run --rm -d \
            -p 127.0.0.1:18080:8000 \
            -e MCP_FS_AUTH_TOKEN="$token" \
            mcp-filesystem-rust:ci)
          trap 'docker stop "$container_id" >/dev/null 2>&1 || true' EXIT
          for attempt in {1..50}; do
            if curl --fail --silent http://127.0.0.1:18080/health >/dev/null; then
              break
            fi
            sleep 0.1
          done
          response=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"container-smoke","version":"1.0"}}}' \
            http://127.0.0.1:18080/mcp)
          grep -q 'File System Server' <<<"$response"

  differential:
    name: Python/Rust differential probe
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0

      - name: Build both implementations
        run: |
          python -m pip install ./production-filesystem
          cargo build --locked --release --manifest-path rust-filesystem/Cargo.toml

      - name: Compare stdio contracts and read-only fixtures
        run: |
          python contract/differential_stdio.py \
            --python-command mcp-filesystem-server \
            --rust-command "$PWD/rust-filesystem/target/release/mcp-filesystem-server"
