[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-filesystem-server"
version = "0.1.0"
description = "Production-grade MCP file system server (Phase 1: read-only, workspace-scoped listing)."
readme = "README.md"
requires-python = ">=3.10"
# The ONLY runtime dependency is the official MCP SDK (v2). Everything else
# (validation, env config) uses libraries the SDK already pulls in (pydantic).
dependencies = [
    "mcp>=2.0.0,<3",
]

[project.optional-dependencies]
# Development-only tooling: pytest for the test-suite. Linters/type checkers
# arrive in Phase 5 (observability/CI milestone).
dev = [
    "pytest>=8",
]

[project.scripts]
# Installing this package gives you a real command on your PATH. opencode
# launches THIS binary (instead of "python /path/to/file.py" like Lesson 1).
# That is the production upgrade: versioned, installed, upgradeable.
mcp-filesystem-server = "mcp_fs.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_fs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
