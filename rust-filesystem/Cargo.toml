[package]
name = "mcp-filesystem-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "Secure, token-conscious MCP filesystem server"
license = "MIT"
publish = false

[[bin]]
name = "mcp-filesystem-server"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = "0.8"
bytecount = "0.6"
command-group = "5.0"
diffy = { version = "0.5", features = ["std"] }
globset = "0.4"
regex = "1.12"
rmcp = { version = "3.11", features = ["server", "macros", "transport-io", "transport-streamable-http-server", "schemars"] }
ruff_python_ast = "0.0.23"
ruff_python_parser = "0.0.23"
ruff_text_size = "0.0.23"
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
shell-words = "1.1"
subtle = "2.6"
thiserror = "2.0"
tempfile = "3.23"
tokio = { version = "1.48", features = ["io-std", "macros", "net", "rt-multi-thread", "signal", "sync"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.29", features = ["v4"] }
walkdir = "2.5"

[dev-dependencies]

[profile.release]
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
must_use_candidate = "allow"
similar_names = "allow"
